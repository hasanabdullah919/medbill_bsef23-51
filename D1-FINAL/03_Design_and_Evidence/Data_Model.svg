<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#294b62"/></marker></defs><g font-family="DejaVu Sans,Arial" fill="#111"><text x="45" y="55" font-size="32" font-weight="bold">MedBill D1 database and storage schema</text><rect x="45" y="110" width="530" height="390" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="67" y="150" font-size="26" font-weight="bold">Document</text><text x="67" y="192" font-size="23">id UUID primary key</text><text x="67" y="224" font-size="23">name, storageKey unique, size</text><text x="67" y="256" font-size="23">status, classification, destinationFolder</text><text x="67" y="288" font-size="23">result, provider, error, reasons</text><text x="67" y="320" font-size="23">createdAt, updatedAt, processedAt</text><rect x="665" y="110" width="420" height="290" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="687" y="150" font-size="26" font-weight="bold">DebugSession</text><text x="687" y="192" font-size="23">id UUID primary key</text><text x="687" y="224" font-size="23">data JSON: IDs and checkpoints</text><text x="687" y="256" font-size="23">expiresAt, createdAt</text><text x="687" y="288" font-size="23">No SQL foreign key relation</text><rect x="1190" y="110" width="365" height="290" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="1212" y="150" font-size="26" font-weight="bold">R2 object</text><text x="1212" y="192" font-size="23">key = Document.storageKey</text><text x="1212" y="224" font-size="23">bytes = original PDF</text><text x="1212" y="256" font-size="23">Backup copies + manifest</text><text x="1212" y="288" font-size="23">No PDF bytes in PostgreSQL</text><line x1="575" y1="240" x2="665" y2="240" stroke="#294b62" stroke-width="3" marker-end="url(#arrow)"/><text x="620.0" y="228.0" text-anchor="middle" font-size="20">IDs in JSON</text><line x1="575" y1="520" x2="1350" y2="520" stroke="#294b62" stroke-width="3" marker-end="url(#arrow)"/><text x="962.5" y="508.0" text-anchor="middle" font-size="20">storageKey references R2 object</text><text x="45" y="620" font-size="22">Two actual Prisma models. Debug references are inside JSON; no patient/claim/payment entity is implemented.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#294b62"/></marker></defs><g font-family="DejaVu Sans,Arial" fill="#111"><text x="45" y="55" font-size="32" font-weight="bold">MedBill D1 processing architecture</text><rect x="45" y="120" width="300" height="175" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="67" y="160" font-size="26" font-weight="bold">Browser</text><text x="67" y="202" font-size="23">Select/upload PDFs</text><text x="67" y="234" font-size="23">Complete or debug run</text><text x="67" y="266" font-size="23">Inspect and download</text><rect x="435" y="110" width="570" height="225" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="457" y="150" font-size="26" font-weight="bold">Next.js Node.js backend</text><text x="457" y="192" font-size="23">Read PDF &gt; text / Tesseract OCR</text><text x="457" y="224" font-size="23">Deterministic checks &gt; text-only AI</text><text x="457" y="256" font-size="23">Move original &gt; save metadata</text><rect x="1135" y="95" width="415" height="130" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="1157" y="135" font-size="26" font-weight="bold">PostgreSQL via Prisma</text><text x="1157" y="177" font-size="23">Document and DebugSession</text><rect x="1135" y="280" width="415" height="190" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="1157" y="320" font-size="26" font-weight="bold">Cloudflare R2</text><text x="1157" y="362" font-size="23">input/ and output categories</text><text x="1157" y="394" font-size="23">backups/&lt;timestamp&gt;/</text><text x="1157" y="426" font-size="23">Original PDF files</text><rect x="435" y="420" width="570" height="125" rx="10" fill="#f4f8fa" stroke="#294b62" stroke-width="2"/><text x="457" y="460" font-siz